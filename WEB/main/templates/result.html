<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Kết quả nhận dạng</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .result-layout{
            display: grid;
            grid-template-columns: 200px 1fr 360px;
            height: calc(100vh - 110px);
            overflow: hidden;
        }

        .sidebar{
            overflow-y: auto;
        }

        .vehicle-item.active{
            background: #1c558c;
            border-left: 5px solid #f2c94c;
        }

        .main-view{
            padding: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .main-label{
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #f2c94c;
        }

        .main-view img,
        .main-view video{
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border: 4px solid #666;
            border-radius: 10px;
            background: #000;
        }

        .main-view.active img,
        .main-view.active video{
            border-color: #f2c94c;
        }

        .detail-panel{
            padding: 14px;
            border-left: 4px solid #f2c94c;
            overflow-y: auto;
        }

        .detail-panel img{
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<header class="header">
    <div class="header-left">
        <h1>KẾT QUẢ XỬ LÝ</h1>
        <p>ID: {{ fid }}</p>
    </div>
    <div class="header-right">
        <img src="{{ url_for('static', filename='icons/logo.png') }}">
    </div>
</header>

<div class="result-layout">

    <!-- ===== CỘT TRÁI ===== -->
    <aside class="sidebar" id="vehicleList">
        <h3>🚗 Phương tiện</h3>
        {% for v in meta.vehicles %}
        <div class="vehicle-item" onclick="showVehicle({{ loop.index0 }}, this)">
            Xe {{ v.vehicle_index }}
        </div>
        {% endfor %}
    </aside>

    <!-- ===== CỘT GIỮA ===== -->
    <main class="main-view" id="mainView">
        <div class="main-label" id="mainLabel">Chưa chọn phương tiện</div>

        {% if meta.type == "video" %}
            <video controls id="mainMedia">
                <source src="{{ url_for('static', filename='videos/' + meta.output) }}">
            </video>
        {% else %}
            <img id="mainMedia" src="{{ url_for('static', filename='images/' + meta.output) }}">
        {% endif %}
    </main>

    <!-- ===== CỘT PHẢI ===== -->
    <aside class="detail-panel" id="detail">
        <h3>Chọn phương tiện để xem chi tiết</h3>
    </aside>

</div>

<!-- ===== DATA ===== -->
<script id="vehicle-data" type="application/json">
{{ meta.vehicles | tojson }}
</script>

<script>
const vehicles = JSON.parse(
    document.getElementById("vehicle-data").textContent
);

function showVehicle(index, el){
    const v = vehicles[index];

    /* highlight sidebar */
    document.querySelectorAll(".vehicle-item")
        .forEach(i => i.classList.remove("active"));
    el.classList.add("active");

    /* highlight ảnh tổng */
    const mainView = document.getElementById("mainView");
    mainView.classList.add("active");
    document.getElementById("mainLabel").innerText = `Đang xem: Xe ${v.vehicle_index}`;

    /* show detail */
    let html = "";

    if(v.vehicle_image){
        html += `
            <h3>🚗 Ảnh phương tiện</h3>
            <img src="/static/images/${v.vehicle_image}">
        `;
    }

    if(v.plate_image){
        html += `
            <h3>🔢 Biển số</h3>
            <img src="/static/images/${v.plate_image}">
        `;
    }

    html += `
        <h3>📄 Thông tin</h3>
        <p><b>Biển số:</b> ${v.plate_final || "Không xác định"}</p>
    `;

    document.getElementById("detail").innerHTML = html;
}
</script>

</body>
</html>
